<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AutoClicker Pro</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="header">
    <h1>🖱️ AutoClicker Pro</h1>
    <p class="subtitle">Automated Element Clicker</p>
  </div>

  <div class="status-panel">
    <div class="status-indicator" id="status-indicator"></div>
    <div class="status-text" id="status-text">Stopped</div>
    <div class="timer" id="timer">00:00</div>
  </div>

  <div class="stats-grid">
    <div class="stat-card">
      <div class="stat-icon">🔍</div>
      <div class="stat-value" id="stat-found">0</div>
      <div class="stat-label">Found</div>
    </div>
    <div class="stat-card">
      <div class="stat-icon">✅</div>
      <div class="stat-value" id="stat-clicked">0</div>
      <div class="stat-label">Clicked</div>
    </div>
    <div class="stat-card">
      <div class="stat-icon">⏭️</div>
      <div class="stat-value" id="stat-skipped">0</div>
      <div class="stat-label">Skipped</div>
    </div>
    <div class="stat-card">
      <div class="stat-icon">❌</div>
      <div class="stat-value" id="stat-errors">0</div>
      <div class="stat-label">Errors</div>
    </div>
  </div>

  <div class="controls">
    <button id="btn-start" class="btn primary">▶️ Start</button>
    <button id="btn-pause" class="btn secondary hidden">⏸️ Pause</button>
    <button id="btn-stop" class="btn danger">⏹️ Stop</button>
    <button id="btn-rescan" class="btn secondary">🔄 Re-scan</button>
  </div>

  <div class="collapsible">
    <button class="collapsible-btn">Configuration</button>
    <div class="collapsible-content">
      <div class="config-group">
        <label for="click-delay">Click Delay (<span id="delay-val">1000</span>ms)</label>
        <input type="range" id="click-delay" min="100" max="5000" step="100" value="1000">
      </div>
      <div class="config-group toggle-group">
        <label>Include Links</label>
        <label class="switch"><input type="checkbox" id="inc-links"><span class="slider round"></span></label>
      </div>
      <div class="config-group toggle-group">
        <label>Include Iframes</label>
        <label class="switch"><input type="checkbox" id="inc-iframes"><span class="slider round"></span></label>
      </div>
      <div class="config-group toggle-group">
        <label>Include Shadow DOM</label>
        <label class="switch"><input type="checkbox" id="inc-shadow"><span class="slider round"></span></label>
      </div>
      <div class="config-group toggle-group">
        <label>Prevent Navigation</label>
        <label class="switch"><input type="checkbox" id="prev-nav" checked><span class="slider round"></span></label>
      </div>
      <div class="config-group">
        <label for="max-depth">Max Click Depth</label>
        <input type="number" id="max-depth" min="1" max="10" value="5">
      </div>
      <div class="config-group">
        <label for="click-order">Click Order</label>
        <select id="click-order">
          <option value="dom">DOM Order</option>
          <option value="visual">Visual Order</option>
          <option value="random">Random</option>
        </select>
      </div>
      <div class="config-group">
        <label for="element-filter">Element Filter (CSS Selector)</label>
        <input type="text" id="element-filter" placeholder="e.g. button, a">
      </div>
      <div class="config-group">
        <label for="exclude-selectors">Exclude Selectors</label>
        <textarea id="exclude-selectors" rows="2" placeholder=".ad-banner&#10;#skip-this"></textarea>
      </div>
      <div class="config-group">
        <label for="max-clicks">Max Clicks (0 = unlimited)</label>
        <input type="number" id="max-clicks" value="0" min="0">
      </div>
      <div class="config-group toggle-group">
        <label>Skip Dangerous (logout/delete)</label>
        <label class="switch"><input type="checkbox" id="skip-dangerous" checked><span class="slider round"></span></label>
      </div>
    </div>
  </div>

  <div class="collapsible">
    <button class="collapsible-btn">Activity Log</button>
    <div class="collapsible-content log-content">
      <div class="activity-log" id="activity-log"></div>
    </div>
  </div>

  <div class="footer">
    <button id="btn-export" class="btn-text">Export Report (JSON)</button>
    <span class="version">v1.0.0</span>
  </div>

  <script src="popup.js"></script>
</body>
</html>
